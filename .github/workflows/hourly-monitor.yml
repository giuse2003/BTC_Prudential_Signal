name: BTC-USD Signal monitor

on:
  schedule:
    - cron: "*/10 * * * *" # aggiorna Coinbase e pubblica un pacchetto coerente
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-usd-signal-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Restore monitor state (cache)
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state
            data/BTC-USD_coinbase_daily.csv
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Run hourly monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python hourly_monitor.py

      - name: Publish dashboard status
        run: |
          mkdir -p docs
          cp reports/status.json docs/status.json
          cp reports/chart-data.json docs/chart-data.json
          cp reports/live-status.json docs/live-status.json
          cp reports/raw_candles.csv docs/raw_candles.csv
          cp reports/historical_signals.csv docs/historical_signals.csv
          cp reports/equity_timeseries.csv docs/equity_timeseries.csv
          cp reports/report.txt docs/report.txt
          cp reports/price_sma_signals.png docs/price_sma_signals.png
          cp reports/manifest.json docs/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/chart-data.json docs/live-status.json docs/raw_candles.csv docs/historical_signals.csv docs/equity_timeseries.csv docs/report.txt docs/price_sma_signals.png docs/manifest.json
          git diff --cached --quiet || git commit -m "Aggiorna pacchetto BTC-USD Signal"
          git push

      - name: Save monitor state (cache)
        uses: actions/cache/save@v4
        with:
          path: |
            .state
            data/BTC-USD_coinbase_daily.csv
          key: state-${{ github.run_id }}

