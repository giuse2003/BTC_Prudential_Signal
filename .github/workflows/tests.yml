name: Tests and frozen baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Reproduce frozen baseline offline
        run: python reproduce.py --manifest docs/runs/baseline-v1-2026-07-26/manifest.json

      - name: Reproduce BTC candidate experiment offline
        run: python reproduce_candidate_experiment.py --manifest docs/experiments/btc-model-candidates-v1-2026-07-26/manifest.json
